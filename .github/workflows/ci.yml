# Source check only: type check + static build. Nothing is published from this repository;
# the panel is deployed together with the backend on the project's own server.
name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"
